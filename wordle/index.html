  body {

    font-family: "ShlomoStam", "Times New Roman", serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px;
  }

  .sub { color: var(--gray); font-size: 0.85em; margin-bottom: 12px; text-align: center; }
  #board {
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px;
  }
  .row { display: flex; direction: rtl; gap: 6px; }
  .tile {
    width: 52px; height: 52px; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8em; font-weight: bold; text-transform: none;
    background: var(--bg);
  }
  .tile.filled { border-color: #878a8c; }
  .tile.correct { background: var(--green); border-color: var(--green); color: white; }
  .tile.present { background: var(--yellow); border-color: var(--yellow); color: white; }
  .tile.absent { background: var(--gray); border-color: var(--gray); color: white; }
  #keyboard { display: flex; flex-direction: column; gap: 6px; max-width: 560px; }
  .krow { display: flex; direction: rtl; gap: 4px; justify-content: center; }
  .key {
    background: var(--key-bg); border: none; border-radius: 4px;
    padding: 10px 8px; font-size: 1.1em; font-weight: bold; cursor: pointer;
    min-width: 34px; font-family: inherit; color: var(--fg);
  }
  .key.wide { min-width: 56px; font-size: 0.75em; font-family: sans-serif; }
  .key.correct { background: var(--green); color: white; }
  .key.present { background: var(--yellow); color: white; }
  .key.absent { background: var(--gray); color: white; opacity: 0.85; }
  #msg { min-height: 1.5em; margin: 10px 0; font-weight: bold; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  #newgame, #giveup {
    padding: 8px 20px; font-size: 1em; cursor: pointer;
    border-radius: 6px; border: none; color: white; font-family: sans-serif;
  }
  #newgame { background: #538d4e; }
  #giveup { background: #8b3a3a; }
</style>
</head>

<div id="msg"></div>

// Final letter forms are a display convention, not a distinct letter:
// matching/typing always uses the regular form, and only the last tile
// of a word is ever rendered with the final glyph.
const FINAL_FORM = { 'כ':'ך', 'מ':'ם', 'נ':'ן', 'פ':'ף', 'צ':'ץ' };

function toDisplay(tile, isLast) {
  if (!isLast) return tile;
  const base = tile[0];
  const rest = tile.slice(1); // shin/sin dot, if any
  return (FINAL_FORM[base] || base) + rest;
}

// A "tile" is one base consonant plus an optional following shin/sin dot.
function toTiles(word) {
  const tiles = [];
  const chars = Array.from(word);
  for (let i = 0; i < chars.length; i++) {
    const c = chars[i];
    const code = c.codePointAt(0);
    if (code === 0x05C1 || code === 0x05C2) {
      // dot belongs to the previous tile
      if (tiles.length) tiles[tiles.length - 1] += c;
      continue;
    }
    tiles.push(c);
  }
  return tiles;
}

const KEY_ROWS = [
  ['א','ב','ג','ד','ה','ו','ז','ח'],
  ['ט','י','כ','ל','מ','נ','ס','ע'],
  ['פ','צ','ק','ר','שׁ','שׂ','ת']
];

let target, targetTiles, guesses, current, done;

function newGame() {
  target = TARGETS[Math.floor(Math.random() * TARGETS.length)];
  targetTiles = toTiles(target);
  guesses = [];
  current = [];
  done = false;
  document.getElementById('msg').textContent = '';
  buildBoard();
  buildKeyboard();
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = 'tile-' + r + '-' + c;
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
  renderCurrent();
}

function renderCurrent() {
  const r = guesses.length;
  for (let c = 0; c < 5; c++) {
    const tile = document.getElementById('tile-' + r + '-' + c);
    if (!tile) continue;
    tile.textContent = current[c] ? toDisplay(current[c], c === 4) : '';
    tile.classList.toggle('filled', !!current[c]);
  }
}

function scoreGuess(tiles) {
  const result = new Array(5).fill('absent');
  const remaining = {};
  for (let i = 0; i < 5; i++) {
    if (tiles[i] === targetTiles[i]) {
      result[i] = 'correct';
    } else {
      remaining[targetTiles[i]] = (remaining[targetTiles[i]] || 0) + 1;
    }
  }
  for (let i = 0; i < 5; i++) {
    if (result[i] === 'correct') continue;
    if (remaining[tiles[i]] > 0) {
      result[i] = 'present';
      remaining[tiles[i]]--;
    }
  }
  return result;
}

const keyStatus = {};

function submitGuess() {
  if (done || current.length !== 5) return;
  const word = current.join('');
  if (!ACCEPT.has(word)) {
    showMsg('Not in word list');
    return;
  }
  const result = scoreGuess(current);
  const r = guesses.length;
  for (let c = 0; c < 5; c++) {
    const tile = document.getElementById('tile-' + r + '-' + c);
    tile.classList.add(result[c]);
    const k = current[c];
    const rank = { absent: 0, present: 1, correct: 2 };
    if (!keyStatus[k] || rank[result[c]] > rank[keyStatus[k]]) keyStatus[k] = result[c];
  }
  guesses.push(current);
  updateKeyboardColors();

  if (word === target) {
    showMsg('Correct! ' + current.map((t, i) => toDisplay(t, i === 4)).join(''));
    done = true;
    return;
  }
  if (guesses.length === 6) {
    showMsg('Out of guesses. Word was: ' + targetTiles.map((t, i) => toDisplay(t, i === 4)).join(''));
    done = true;
    return;
  }
  current = [];
  renderCurrent();
}

function showMsg(text) {
  document.getElementById('msg').textContent = text;
}

function pressKey(k) {
  if (done) return;
  if (current.length < 5) {
    current.push(k);
    renderCurrent();
  }
}

function backspace() {
  if (done) return;
  current.pop();
  renderCurrent();
}

function addKeyRow(kb, keys, extraClass) {
  const krow = document.createElement('div');
  krow.className = 'krow' + (extraClass ? ' ' + extraClass : '');
  for (const k of keys) {
    const btn = document.createElement('button');
    btn.className = 'key';
    btn.textContent = k;
    btn.onclick = () => pressKey(k);
    krow.appendChild(btn);
  }
  kb.appendChild(krow);
}

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  for (const row of KEY_ROWS) addKeyRow(kb, row);

  const lastRow = document.createElement('div');
  lastRow.className = 'krow';
  const enterBtn = document.createElement('button');
  enterBtn.className = 'key wide';
  enterBtn.textContent = 'Enter';
  enterBtn.onclick = submitGuess;
  const delBtn = document.createElement('button');
  delBtn.className = 'key wide';
  delBtn.textContent = 'Del';
  delBtn.onclick = backspace;
  lastRow.appendChild(enterBtn);
  lastRow.appendChild(delBtn);
  kb.appendChild(lastRow);
  updateKeyboardColors();
}

function updateKeyboardColors() {
  document.querySelectorAll('.key').forEach(btn => {
    const k = btn.textContent;
    if (keyStatus[k]) {
      btn.classList.remove('correct', 'present', 'absent');
      btn.classList.add(keyStatus[k]);
    }
  });
}

document.getElementById('newgame').onclick = () => { Object.keys(keyStatus).forEach(k => delete keyStatus[k]); newGame(); };

document.getElementById('giveup').onclick = () => {
  if (done) return;
  showMsg('Word was: ' + targetTiles.map((t, i) => toDisplay(t, i === 4)).join(''));
  done = true;
};

newGame();
